<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Fraud Checker</title>

<style>
  :root {
    --bg: #eef2f1;
    --surface: #ffffff;
    --ink: #14213d;
    --muted: #5b6577;
    --line: #cfd8d6;
    --safe: #1e7f5c;
    --warn: #a86f00;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a24;
      --surface: #172433;
      --ink: #e8eef5;
      --muted: #9aa8bb;
      --line: #2b3b4e;
      --safe: #4cc79a;
      --warn: #e7b24a;
      --danger: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  header svg { width: 64px; height: 64px; flex: none; }
  h1 { font-size: 1.5rem; line-height: 1.2; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
  .box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
  }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  label:first-child { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 11px 12px;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .money { display: flex; align-items: stretch; }
  .money span {
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-weight: 700;
    background: var(--line);
    border: 1px solid var(--line);
    border-right: 0;
    border-radius: 8px 0 0 8px;
    white-space: nowrap;
  }
  .money input { border-radius: 0 8px 8px 0; }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    font: inherit;
    font-weight: 700;
    color: var(--bg);
    background: var(--ink);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button.ghost {
    width: auto;
    margin: 0;
    padding: 6px 12px;
    font-size: 0.85rem;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
  }
  #result { margin-top: 20px; display: none; border-left: 6px solid var(--line); }
  #result.safe { border-left-color: var(--safe); }
  #result.warn { border-left-color: var(--warn); }
  #result.danger { border-left-color: var(--danger); }
  #verdict { font-size: 1.3rem; font-weight: 700; margin: 0; }
  .safe #verdict { color: var(--safe); }
  .warn #verdict { color: var(--warn); }
  .danger #verdict { color: var(--danger); }
  #score { color: var(--muted); margin: 0 0 8px; }
  #reasons { margin: 0; padding-left: 20px; }
  .meter { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; margin: 6px 0 12px; }
  .meter div { height: 100%; width: 0; border-radius: 5px; background: var(--safe); transition: width 0.4s; }
  .warn .meter div { background: var(--warn); }
  .danger .meter div { background: var(--danger); }
  .safe .meter div { background: var(--safe); }
  #history { margin-top: 20px; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .head h2 { margin: 0; }
  .item { padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item .row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.95rem; }
  .item .when { color: var(--muted); font-size: 0.8rem; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar div { height: 100%; border-radius: 4px; }
  .bar .safe { background: var(--safe); }
  .bar .warn { background: var(--warn); }
  .bar .danger { background: var(--danger); }
  .empty { color: var(--muted); margin: 0; }
  #about { margin-top: 20px; text-align: center; }
  #about img { width: 100%; max-width: 300px; border-radius: 12px; }

  /* ---------- Intro splash (your logo image, 2 seconds) ---------- */
  body.loading { overflow: hidden; }
  main { transition: opacity 0.9s 0.25s ease, transform 0.9s 0.25s ease; }
  body.loading main { opacity: 0; transform: translateY(28px); }
  #splash {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    background: radial-gradient(circle at 50% 42%, #0d2b5a 0%, #040c24 72%);
    transition: transform 0.9s cubic-bezier(0.77, 0, 0.18, 1);
    cursor: pointer;
  }
  #splash.hide { transform: translateY(-100%); }

  /* Image logo */
  #splash .logo-box {
    position: relative;
    width: min(74vw, 340px);
    aspect-ratio: 1;
    border-radius: 26px;
    overflow: hidden;
    opacity: 0;
  }
  #splash .logo-box img { display: block; width: 100%; height: 100%; object-fit: cover; }
  #splash .logo-box::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    left: -60%;
    width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.35), transparent);
    transform: skewX(-18deg);
    opacity: 0;
  }
  #splash.ready .logo-box { animation: imgIn 0.9s 0s both cubic-bezier(0.2, 0.8, 0.2, 1), glow 1.2s 0.8s both ease-in-out; }
  #splash.ready .logo-box::after { animation: sweep 0.8s 0.85s both ease-in-out; }
  @keyframes imgIn {
    from { opacity: 0; transform: scale(0.78); filter: blur(14px); }
    to   { opacity: 1; transform: scale(1);    filter: blur(0); }
  }
  @keyframes glow {
    0%   { box-shadow: 0 0 0 rgba(38, 208, 206, 0); }
    50%  { box-shadow: 0 0 70px rgba(38, 208, 206, 0.55); }
    100% { box-shadow: 0 0 40px rgba(38, 208, 206, 0.3); }
  }
  @keyframes sweep {
    0%   { left: -60%; opacity: 1; }
    100% { left: 130%; opacity: 1; }
  }

  /* Fallback logo (only shown if the image file is missing) */
  #splash .fb { display: none; flex-direction: column; align-items: center; gap: 16px; }
  #splash.noimg .fb { display: flex; }
  #splash.noimg .logo-box { display: none; }
  #splash .fb svg { width: min(56vw, 240px); height: auto; overflow: visible; }
  #splash .fb svg * { transform-box: fill-box; transform-origin: center; }
  #splash.ready .a-tile   { animation: pop 0.45s 0s both cubic-bezier(0.2, 0.8, 0.2, 1); }
  #splash.ready .a-shield { animation: pop 0.6s 0.15s both cubic-bezier(0.2, 0.9, 0.25, 1.2); }
  #splash.ready .a-card   { animation: rise 0.5s 0.55s both cubic-bezier(0.2, 0.8, 0.2, 1); }
  #splash.ready .a-badge  { animation: pop 0.45s 0.95s both cubic-bezier(0.2, 1.4, 0.4, 1); }
  #splash .a-check { stroke-dasharray: 90; }
  #splash.ready .a-check  { animation: draw 0.4s 1.25s both ease-out; }
  @keyframes pop  { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes draw { from { stroke-dashoffset: 90; } to { stroke-dashoffset: 0; } }
  #splash .title { margin: 0; color: #e8eef5; font-size: 1.3rem; font-weight: 700; }

  /* Loading bar */
  #splash .loadbar {
    width: min(46vw, 190px);
    height: 3px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }
  #splash .loadbar i { display: block; height: 100%; width: 0; background: #26d0ce; }
  #splash.ready .loadbar i { animation: load 1.9s 0.05s forwards linear; }
  @keyframes load { to { width: 100%; } }
  .note { color: var(--muted); font-size: 0.9rem; margin-top: 20px; }
</style>
</head>

<main>
  <header>
    <svg viewBox="0 0 512 512" role="img" aria-label="Card Fraud Checker logo">
      <rect width="512" height="512" rx="96" fill="#eef2f1"/>
      <path d="M256 52L428 118V250C428 352 352 426 256 460C160 426 84 352 84 250V118Z" fill="#14213d"/>
      <rect x="146" y="188" width="220" height="140" rx="18" fill="#eef2f1"/>
      <rect x="146" y="218" width="220" height="30" fill="#14213d"/>
      <rect x="172" y="272" width="44" height="30" rx="6" fill="#a86f00"/>
      <circle cx="344" cy="324" r="58" fill="#1e7f5c" stroke="#14213d" stroke-width="12"/>
      <path d="M316 324L338 346L374 304" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <h1>Card Fraud Checker</h1>
      <p class="sub">See how suspicious a transaction looks.</p>
    </div>
  </header>

  <div class="box">
    <label for="country">Where was the transaction made?</label>
    <select id="country"></select>

    <label for="amount" id="amountLabel">Transaction amount</label>
    <div class="money">
      <span id="symbol">৳</span>
      <input id="amount" type="number" min="0" inputmode="decimal" placeholder="e.g. 25000">
    </div>

    <label for="hour">Transaction time</label>
    <input id="hour" type="time" value="14:00">

    <label for="mode">Transaction type</label>
    <select id="mode">
      <option value="pos">In person (POS/ATM)</option>
      <option value="online">Online</option>
    </select>

    <label for="recent">Transactions in the last hour</label>
    <input id="recent" type="number" min="0" inputmode="numeric" value="0">

    <label for="newmerchant">Have you used this shop or website before?</label>
    <select id="newmerchant">
      <option value="old">Yes, I have used it before</option>
      <option value="new">No, this is the first time</option>
    </select>

    <button id="check">Check transaction</button>
  </div>

  <div id="result" class="box" aria-live="polite">
    <p id="verdict"></p>
    <p id="score"></p>
    <div class="meter"><div id="meterFill"></div></div>
    <ul id="reasons"></ul>
  </div>

  <div id="history" class="box">
    <div class="head">
      <h2>Recent checks</h2>
      <button class="ghost" id="clearHistory">Clear</button>
    </div>
    <div id="historyList"></div>
  </div>

  <p class="note">The risk model was trained in Python on practice data, so this is a learning demo. Amount limits use approximate exchange rates. Never enter a real card number or CVV here.</p>
</main>

<script>
  // ---------- Intro: show logo first, then reveal the page ----------
  (function () {
    var splash = document.getElementById("splash");
    var img = document.getElementById("splashImg");
    var started = false;

    function endSplash() {
      if (!splash || splash.dataset.done) { return; }
      splash.dataset.done = "1";
      document.body.classList.remove("loading");
      splash.classList.add("hide");
      setTimeout(function () { splash.remove(); }, 1100);
    }

    // Start the animation only once the image is ready, then keep it for 2 seconds
    function start() {
      if (started) { return; }
      started = true;
      splash.classList.add("ready");
      setTimeout(endSplash, 2000);
    }

    splash.addEventListener("click", endSplash);

    img.addEventListener("error", function () {
      splash.classList.add("noimg");
      start();
    });
    if (img.complete) {
      if (img.naturalWidth === 0) { splash.classList.add("noimg"); }
      start();
    } else {
      img.addEventListener("load", start);
      setTimeout(start, 2500); // safety: never get stuck on a slow connection
    }
  })();
  var HOME = "Bangladesh";

  // Each country: [name, currency code, symbol, approx. units per 1 USD]
  var REGIONS = {
    "Asia": [
      ["Bangladesh", "BDT", "৳", 122],
      ["India", "INR", "₹", 85],
      ["Pakistan", "PKR", "Rs", 280],
      ["Sri Lanka", "LKR", "Rs", 300],
      ["Nepal", "NPR", "Rs", 135],
      ["China", "CNY", "¥", 7.2],
      ["Japan", "JPY", "¥", 150],
      ["South Korea", "KRW", "₩", 1350],
      ["Singapore", "SGD", "S$", 1.35],
      ["Malaysia", "MYR", "RM", 4.5],
      ["Thailand", "THB", "฿", 35],
      ["Indonesia", "IDR", "Rp", 16000],
      ["United Arab Emirates", "AED", "AED", 3.67],
      ["Saudi Arabia", "SAR", "SAR", 3.75],
      ["Qatar", "QAR", "QAR", 3.64],
      ["Turkey", "TRY", "₺", 40]
    ],
    "North & South America": [
      ["United States", "USD", "$", 1],
      ["Canada", "CAD", "C$", 1.37],
      ["Mexico", "MXN", "MX$", 19],
      ["Brazil", "BRL", "R$", 5.5],
      ["Argentina", "ARS", "AR$", 1000],
      ["Colombia", "COP", "COL$", 4000],
      ["Chile", "CLP", "CL$", 950]
    ],
    "Africa": [
      ["Nigeria", "NGN", "₦", 1500],
      ["Egypt", "EGP", "E£", 50],
      ["South Africa", "ZAR", "R", 18],
      ["Kenya", "KES", "KSh", 129],
      ["Ethiopia", "ETB", "Br", 130],
      ["Ghana", "GHS", "GH₵", 15],
      ["Morocco", "MAD", "MAD", 10]
    ],
    "Europe & Oceania": [
      ["United Kingdom", "GBP", "£", 0.78],
      ["Germany", "EUR", "€", 0.92],
      ["France", "EUR", "€", 0.92],
      ["Italy", "EUR", "€", 0.92],
      ["Spain", "EUR", "€", 0.92],
      ["Australia", "AUD", "A$", 1.5]
    ]
  };

  var countryData = {};
  var countrySelect = document.getElementById("country");

  Object.keys(REGIONS).forEach(function (region) {
    var group = document.createElement("optgroup");
    group.label = region;
    REGIONS[region].forEach(function (c) {
      countryData[c[0]] = { code: c[1], symbol: c[2], rate: c[3] };
      var opt = document.createElement("option");
      opt.value = c[0];
      opt.textContent = c[0];
      group.appendChild(opt);
    });
    countrySelect.appendChild(group);
  });
  countrySelect.value = HOME;

  function updateCurrency() {
    var c = countryData[countrySelect.value];
    document.getElementById("symbol").textContent = c.symbol;
    document.getElementById("amountLabel").textContent = "Transaction amount (" + c.code + ")";
    document.getElementById("amount").placeholder = "e.g. " + Math.round(200 * c.rate);
  }
  countrySelect.addEventListener("change", updateCurrency);
  updateCurrency();

  // ---------- Model trained in Python (logistic regression) ----------
  // These numbers were learned in Google Colab. Positive weight = more suspicious.
  var MODEL = {
    intercept: -7.48,
    weights: {
      abroad: 5.61,
      amount_over_400: 5.07,
      recent_5plus: 4.76,
      night: 4.18,
      new_merchant: 2.30,
      online: 2.27,
      amount_over_80: 2.17,
      recent_3plus: 1.96
    }
  };

  var FACTOR_TEXT = {
    abroad: "Transaction made outside " + HOME,
    amount_over_400: "Very large amount (about 400 USD or more)",
    amount_over_80: "Large amount (about 80 USD or more)",
    night: "Late-night transaction (12 AM to 5 AM)",
    recent_5plus: "5 or more transactions in one hour",
    recent_3plus: "3 or more transactions in one hour",
    online: "Online transactions carry higher risk",
    new_merchant: "First time at this shop or website"
  };

  function checkFraud(t) {
    var c = countryData[t.country];
    var usd = t.amount / c.rate;

    // Turn the transaction into 0/1 signals (same as make_features in Python)
    var f = {
      amount_over_80: usd > 80 ? 1 : 0,
      amount_over_400: usd > 400 ? 1 : 0,
      night: (t.hour >= 0 && t.hour <= 4) ? 1 : 0,
      abroad: t.country !== HOME ? 1 : 0,
      online: t.mode === "online" ? 1 : 0,
      recent_3plus: t.recent >= 3 ? 1 : 0,
      recent_5plus: t.recent >= 5 ? 1 : 0,
      new_merchant: t.newmerchant === "new" ? 1 : 0
    };

    // Add up the weights, then turn the total into a chance between 0 and 1
    var total = MODEL.intercept;
    var fired = [];
    Object.keys(MODEL.weights).forEach(function (name) {
      if (f[name]) {
        total += MODEL.weights[name];
        fired.push({ name: name, weight: MODEL.weights[name] });
      }
    });
    var chance = 1 / (1 + Math.exp(-total));
    var score = Math.round(chance * 100);

    // Biggest reasons first
    fired.sort(function (a, b) { return b.weight - a.weight; });
    var reasons = fired.map(function (x) { return FACTOR_TEXT[x.name]; });

    var level, text;
    if (score >= 60) { level = "danger"; text = "High risk: block it and contact your bank"; }
    else if (score >= 30) { level = "warn"; text = "Suspicious: double-check this transaction"; }
    else { level = "safe"; text = "Looks safe"; }

    return { score: score, reasons: reasons, level: level, text: text };
  }

  // ---------- History (saved in this browser) ----------
  var KEY = "fraudCheckerHistoryV2";
  var MAX_ITEMS = 8;

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function saveHistory(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }

  function renderHistory() {
    var list = loadHistory();
    var box = document.getElementById("historyList");
    box.innerHTML = "";
    if (list.length === 0) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No checks yet. Your last " + MAX_ITEMS + " results will appear here.";
      box.appendChild(p);
      return;
    }
    list.forEach(function (h) {
      var item = document.createElement("div");
      item.className = "item";

      var row = document.createElement("div");
      row.className = "row";
      var left = document.createElement("span");
      left.textContent = h.symbol + " " + h.amount + " · " + h.country;
      var right = document.createElement("strong");
      right.textContent = h.score + "%";
      row.appendChild(left);
      row.appendChild(right);

      var when = document.createElement("div");
      when.className = "when";
      when.textContent = h.text + " · " + h.when;

      var bar = document.createElement("div");
      bar.className = "bar";
      var fill = document.createElement("div");
      fill.className = h.level;
      fill.style.width = h.score + "%";
      bar.appendChild(fill);

      item.appendChild(row);
      item.appendChild(when);
      item.appendChild(bar);
      box.appendChild(item);
    });
  }

  document.getElementById("clearHistory").addEventListener("click", function () {
    saveHistory([]);
    renderHistory();
  });
  renderHistory();

  // ---------- Check button ----------
  document.getElementById("check").addEventListener("click", function () {
    var timeValue = document.getElementById("hour").value || "12:00";
    var t = {
      amount: Number(document.getElementById("amount").value) || 0,
      hour: Number(timeValue.split(":")[0]),
      country: countrySelect.value,
      mode: document.getElementById("mode").value,
      recent: Number(document.getElementById("recent").value) || 0,
      newmerchant: document.getElementById("newmerchant").value
    };

    var r = checkFraud(t);
    var box = document.getElementById("result");
    box.className = "box " + r.level;
    box.style.display = "block";
    document.getElementById("verdict").textContent = r.text;
    document.getElementById("score").textContent = "Model fraud chance: " + r.score + "%";
    document.getElementById("meterFill").style.width = r.score + "%";

    var list = document.getElementById("reasons");
    list.innerHTML = "";
    if (r.reasons.length === 0) {
      var li = document.createElement("li");
      li.textContent = "No suspicious signs found.";
      list.appendChild(li);
    }
    r.reasons.forEach(function (reason) {
      var li = document.createElement("li");
      li.textContent = reason;
      list.appendChild(li);
    });

    var history = loadHistory();
    history.unshift({
      country: t.country,
      symbol: countryData[t.country].symbol,
      amount: t.amount,
      score: r.score,
      level: r.level,
      text: r.text.split(":")[0],
      when: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
    });
    saveHistory(history.slice(0, MAX_ITEMS));
    renderHistory();

    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
</script>
</body>
</html>
